<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>SparRadar</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#111;--muted:#74746f;--line:#dddcd7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:720px;margin:auto;padding:28px 16px 70px}.brand{display:flex;align-items:center;gap:13px;margin:14px 0 25px}
.logo{width:54px;height:54px;border-radius:16px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}
h1{font-size:40px;letter-spacing:-1.8px;margin:0;line-height:1}.sub{color:var(--muted);font-size:17px;margin-top:6px}
.search{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;gap:8px}
.search input{flex:1;min-width:0;border:0;outline:0;padding:14px 12px;font-size:18px;background:transparent}
button{border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:800;background:#111;color:white}
.chips{display:flex;gap:8px;overflow:auto;padding:13px 0 8px}.chips button{background:#fff;color:#111;border:1px solid var(--line);font-size:14px;padding:10px 13px;white-space:nowrap}
.status{font-size:14px;color:var(--muted);margin:14px 3px}.source{font-size:12px;color:var(--muted);margin:6px 3px 20px}
h2{font-size:26px;margin:26px 0 12px}.results{display:grid;gap:11px}.deal{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.retailer{font-weight:900;font-size:15px}.badge{font-size:12px;background:#efefec;padding:5px 8px;border-radius:999px;color:#444}
.brandname{font-size:21px;font-weight:900;margin:9px 0 2px}.product{color:#4d4d49;margin-bottom:10px}.price{font-size:29px;font-weight:900}.unit{font-size:13px;color:var(--muted);margin-top:5px}.discount{font-size:13px;margin-top:5px;color:#176b2d}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted)}
@media(max-width:520px){.search{flex-direction:column}.search button{width:100%}}
</style>
</head>
<body>
<main>
<div class="brand"><div class="logo">SR</div><div><h1>SparRadar</h1><div class="sub">Was möchtest du günstig kaufen? · v18</div></div></div>

<form id="form" class="search">
<input id="q" type="search" autocomplete="off" placeholder="z. B. Waschmittel, Ketchup, Kaffee">
<button>Suchen</button>
</form>
<div class="chips">
<button data-q="Waschmittel">Waschmittel</button>
<button data-q="Ketchup">Ketchup</button>
<button data-q="Kaffee">Kaffee</button>
<button data-q="Milch">Milch</button>
<button data-q="Toilettenpapier">Toilettenpapier</button>
</div>
<div id="status" class="status">Angebotskatalog wird geladen …</div>
<div class="source">Quelle: öffentliche kaufDA-Angebotsseiten. Preise können regional abweichen.</div>

<h2>Marken im Angebot</h2>
<div id="results" class="results"><div class="empty">Katalog wird geladen …</div></div>
</main>

<script>
const $=id=>document.getElementById(id);
const q=$('q'),status=$('status'),results=$('results');
let catalog=[];

function euro(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss')}

async function loadCatalog(){
 try{
   const r=await fetch('./offers.json?v='+Date.now(),{cache:'no-store'});
   if(!r.ok) throw new Error('HTTP '+r.status);
   const d=await r.json();
   catalog=Array.isArray(d.offers)?d.offers:[];
   status.textContent='Bereit · '+catalog.length+' aktuelle Angebote in '+(d.categories||0)+' Kategorien · Stand '+new Date(d.updatedAt).toLocaleString('de-DE');
   results.innerHTML='<div class="empty">Produkt eingeben und auf „Suchen“ tippen.</div>';
 }catch(e){
   status.textContent='Angebotskatalog konnte nicht geladen werden.';
   results.innerHTML='<div class="empty">Datenfehler: '+esc(e.message)+'</div>';
 }
}

function search(term){
 const needle=norm(term.trim());
 if(!needle)return;
 if(!catalog.length){status.textContent='Katalog ist noch nicht geladen.';return}
 let matches=catalog.filter(x=>norm(x.query)===needle);
 if(!matches.length){
   matches=catalog.filter(x=>norm([x.query,x.product,x.brand,x.retailer].join(' ')).includes(needle));
 }
 if(norm(term)==='ketchup') matches=matches.filter(x=>norm(x.product).includes('ketchup'));
 if(norm(term)==='kaffee') matches=matches.filter(x=>/kaffee|caffe|caffè|espresso|barista/i.test(x.product+' '+x.brand) && !/automat|maschine|geschirr|service/i.test(x.product));
 matches.sort((a,b)=>a.price-b.price || String(a.brand).localeCompare(String(b.brand),'de'));
 const byBrand=new Map();
 for(const x of matches){
   const key=norm(x.brand||x.product);
   if(!byBrand.has(key))byBrand.set(key,x);
 }
 const out=[...byBrand.values()].slice(0,40);
 status.textContent=out.length+' Marken/Angebote gefunden.';
 if(!out.length){results.innerHTML='<div class="empty">Aktuell kein passendes Angebot im Katalog.</div>';return}
 results.innerHTML=out.map(x=>`
   <article class="deal">
     <div class="top"><span class="retailer">${esc(x.retailer)}</span><span class="badge">Angebot</span></div>
     <div class="brandname">${esc(x.brand||'Ohne Marke')}</div>
     <div class="product">${esc(x.product)}</div>
     <div class="price">${euro(x.price)}</div>
     ${x.unit?'<div class="unit">'+esc(x.unit)+'</div>':''}
     ${x.discount?'<div class="discount">Rabatt: '+esc(x.discount)+'</div>':''}
   </article>`).join('');
}

$('form').onsubmit=e=>{e.preventDefault();search(q.value)}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;search(q.value)})
loadCatalog();
</script>
</body>
</html>
