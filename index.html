<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>SparRadar</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#111;--muted:#71716c;--line:#dddcd7}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:720px;margin:auto;padding:22px 16px 60px}.box,.search,.deal{background:var(--card);border:1px solid var(--line);border-radius:18px}
.box{padding:16px;margin-bottom:18px}.box h3{margin:0 0 4px}.muted{color:var(--muted);font-size:14px}
.tokenrow{display:flex;gap:8px;margin-top:12px}.tokenrow input,.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:16px}
button{border:0;border-radius:13px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#111;color:#fff}
.secondary{background:#e9e9e6;color:#111}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.brand{display:flex;align-items:center;gap:12px;margin:20px 0}.logo{width:48px;height:48px;border-radius:14px;background:#111;color:#fff;display:grid;place-items:center;font-weight:900}
h1{margin:0;font-size:38px;letter-spacing:-1.5px}.subtitle{margin:2px 0 0;color:var(--muted)}
.search{display:flex;gap:8px;padding:9px;margin-bottom:10px}.search input{border:0;background:transparent}.chips{display:flex;gap:7px;overflow:auto;padding:5px 0 16px}.chips button{white-space:nowrap;background:#fff;color:#111;border:1px solid var(--line);padding:9px 12px;font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.controls button{background:#fff;color:#111;border:1px solid var(--line);font-size:14px;padding:9px 12px}.controls .active{background:#111;color:#fff}
.status{margin-top:8px;font-size:14px}.ok{color:#176b2d}.err{color:#a12626}
h2{font-size:25px;margin:24px 0 10px}.results{display:grid;gap:10px}.deal{padding:15px}.top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}.store{font-weight:800;color:#111}.brandname{font-size:20px;font-weight:900;margin-top:8px}.product{margin:2px 0 10px;color:#4e4e49}.price{font-size:28px;font-weight:900}.old{text-decoration:line-through;color:var(--muted);margin-left:8px}.unit{font-size:13px;color:var(--muted);margin-top:5px}.empty{padding:28px 10px;text-align:center;color:var(--muted)}
@media(max-width:520px){.tokenrow,.search{flex-direction:column}.tokenrow button,.search button{width:100%}}
</style>
</head>
<body>
<main>
<section class="box">
<h3>Live-Angebote aktivieren</h3>
<div class="muted">Apify-Token einmal einfügen. Er bleibt nur in diesem Browser gespeichert.</div>
<div class="tokenrow"><input id="token" type="password" placeholder="Apify-Token einfügen" autocomplete="off"><button id="save">Speichern</button></div>
<div class="actions"><button class="secondary" id="check">Verbindung prüfen</button><button class="secondary" id="del">Token löschen</button></div>
<div id="tokenStatus" class="status">Noch kein Token gespeichert.</div>
</section>

<div class="brand"><div class="logo">SR</div><div><h1>SparRadar</h1><p class="subtitle">Was möchtest du günstig kaufen? · v16</p></div></div>

<form id="form" class="search"><input id="q" type="search" placeholder="z. B. Waschmittel, Ketchup, Kaffee"><button>Suchen</button></form>
<div class="chips">
<button data-q="Waschmittel">Waschmittel</button><button data-q="Ketchup">Ketchup</button><button data-q="Kaffee">Kaffee</button><button data-q="Toilettenpapier">Toilettenpapier</button>
</div>
<div class="controls">
<button id="loc">Standort verwenden</button>
<button class="radius active" data-r="5">5 km</button><button class="radius" data-r="10">10 km</button><button class="radius" data-r="20">20 km</button>
</div>
<div class="actions"><button class="secondary" id="refreshOffers">Angebote aktualisieren</button></div><div id="liveStatus" class="muted">Bereit.</div>
<h2>Marken im Angebot</h2>
<div id="results" class="results"><div class="empty">Suche nach einem Produkt.</div></div>
</main>
<script>
const ACTOR='nerdrx~de-supermarket-offers',KEY='sparradar_apify_token_v1';
const $=id=>document.getElementById(id), token=$('token'), ts=$('tokenStatus'), ls=$('liveStatus'), results=$('results'), q=$('q');
let radius=5,pos=null;
function saved(){return localStorage.getItem(KEY)||''}
function tokenState(){const ok=!!saved();ts.textContent=ok?'Token ist gespeichert.':'Noch kein Token gespeichert.';ts.className='status '+(ok?'ok':'')}
tokenState();
$('save').onclick=()=>{const t=token.value.trim();if(!t){ts.textContent='Bitte Token einfügen.';ts.className='status err';return}localStorage.setItem(KEY,t);token.value='';ts.textContent='Token gespeichert.';ts.className='status ok'}
$('del').onclick=()=>{localStorage.removeItem(KEY);tokenState()}

async function api(path,opts={}){
 const t=saved(); if(!t) throw new Error('Kein Token gespeichert.');
 const sep=path.includes('?')?'&':'?';
 const r=await fetch('https://api.apify.com/v2/'+path+sep+'token='+encodeURIComponent(t),opts);
 if(!r.ok) throw new Error('Apify '+r.status);
 return await r.json();
}
async function startRun(input){
 return await api('acts/'+ACTOR+'/runs',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(input)});
}
async function waitRun(id){
 for(let i=0;i<120;i++){
   const x=await api('actor-runs/'+id);
   const st=x?.data?.status||'';
   ls.textContent='Angebote werden geladen · '+st.toLowerCase()+' · '+(i*2)+' s';
   if(st==='SUCCEEDED') return x.data;
   if(['FAILED','ABORTED','TIMED-OUT'].includes(st)) throw new Error('Lauf '+st);
   await new Promise(r=>setTimeout(r,2000));
 }
 throw new Error('Zeitüberschreitung');
}
async function loadDataset(id){
 const t=saved();
 const r=await fetch('https://api.apify.com/v2/datasets/'+id+'/items?clean=true&format=json&token='+encodeURIComponent(t));
 if(!r.ok) throw new Error('Dataset '+r.status);
 return await r.json();
}
const CACHE_KEY='sparradar_offers_v16';
const CACHE_TIME='sparradar_offers_time_v16';
function catalog(){try{return JSON.parse(localStorage.getItem(CACHE_KEY)||'[]')}catch{return []}}
function saveCatalog(items){localStorage.setItem(CACHE_KEY,JSON.stringify(items));localStorage.setItem(CACHE_TIME,String(Date.now()))}
async function refreshCatalog(){
 if(!saved()) throw new Error('Bitte zuerst Token speichern.');
 results.innerHTML='<div class="empty">Angebote werden einmalig geladen …</div>';
 ls.textContent='Supermarkt-Angebote werden aktualisiert …';
 const x=await startRun({chains:['aldi-sued','aldi-nord','penny','edeka','lidl','rewe'],keywords:[],maxItems:500,maxPerChain:200,proxyConfiguration:{useApifyProxy:false}});
 const d=x?.data||{};
 const done=await waitRun(d.id);
 const items=await loadDataset(done.defaultDatasetId||d.defaultDatasetId);
 saveCatalog(Array.isArray(items)?items:[]);
 ls.textContent='Fertig · '+items.length+' Angebote gespeichert. Suchen geht jetzt sofort.';
 return items;
}
$('check').onclick=async()=>{ts.textContent='Verbindung wird geprüft …';ts.className='status';try{await api('users/me');ts.textContent='Verbindung funktioniert. Live-Suche ist aktiv.';ts.className='status ok'}catch(e){ts.textContent='Verbindung fehlgeschlagen: '+e.message;ts.className='status err'}}
document.querySelectorAll('.radius').forEach(b=>b.onclick=()=>{radius=+b.dataset.r;document.querySelectorAll('.radius').forEach(x=>x.classList.toggle('active',x===b));if(pos)$('loc').textContent='Standort · '+radius+' km'})
$('loc').onclick=()=>{if(!navigator.geolocation){ls.textContent='Standort nicht verfügbar.';return}ls.textContent='Standort wird ermittelt …';navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};$('loc').textContent='Standort · '+radius+' km';ls.textContent='Standort aktiv.'},()=>ls.textContent='Standort wurde nicht freigegeben.')}
function num(v){const n=Number(String(v??'').replace(',','.').replace(/[^0-9.]/g,''));return Number.isFinite(n)&&n>0?n:null}
function first(o,ks){for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return o[k];return null}
function norm(i){
 const product=first(i,['product','title','name','productName','offerTitle']); const price=num(first(i,['price','offerPrice','currentPrice','salePrice']));
 if(!product||!price)return null;
 return {store:String(first(i,['chain','retailer','store','storeName','merchant'])||'Supermarkt'),product:String(product),brand:String(first(i,['brand','manufacturer'])||String(product).split(/\s+/)[0]||'Marke'),price,old:num(first(i,['oldPrice','regularPrice','originalPrice','beforePrice'])),unit:first(i,['basePrice','unitPrice','pricePerUnit','grundpreis'])||'',valid:first(i,['validTo','validUntil','endDate'])||''}
}
function euro(v){return Number(v).toLocaleString('de-DE',{style:'currency',currency:'EUR'})}
function render(items){
 const m=new Map();
 items.map(norm).filter(Boolean).forEach(x=>{const k=x.brand.toLowerCase();const y=m.get(k);if(!y||x.price<y.price)m.set(k,x)});
 const a=[...m.values()].sort((a,b)=>a.price-b.price);
 if(!a.length){results.innerHTML='<div class="empty">Keine passenden Live-Angebote gefunden.</div>';return}
 results.innerHTML=a.slice(0,30).map(x=>'<article class="deal"><div class="top"><span class="store">'+esc(x.store)+'</span><span>Live</span></div><div class="brandname">'+esc(x.brand)+'</div><div class="product">'+esc(x.product)+'</div><span class="price">'+euro(x.price)+'</span>'+(x.old?'<span class="old">'+euro(x.old)+'</span>':'')+(x.unit?'<div class="unit">'+esc(String(x.unit))+'</div>':'')+'</article>').join('')
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function search(term){
 term=term.trim(); if(!term)return;
 let items=catalog();
 if(!items.length){
   try{items=await refreshCatalog()}catch(e){results.innerHTML='<div class="empty">Angebote konnten nicht geladen werden.</div>';ls.textContent=e.message;return}
 }
 const n=term.toLowerCase();
 const matches=items.filter(i=>[i.title,i.brand,i.description,i.category].filter(Boolean).join(' ').toLowerCase().includes(n));
 render(matches);
 ls.textContent=matches.length+' passende Angebote gefunden · sofort aus dem gespeicherten Katalog.';
}
$('refreshOffers').onclick=async()=>{try{await refreshCatalog()}catch(e){ls.textContent=e.message}}
$('form').onsubmit=e=>{e.preventDefault();search(q.value)}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;search(q.value)})
</script>
</body>
</html>
